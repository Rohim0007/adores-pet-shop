function initCheckout() {
    updateCheckoutTotal();
}

function onDistrictChange() {
    const districtSelect = document.getElementById("deliveryDistrict");
    const areaSelect = document.getElementById("deliveryArea");
    const selectedDistrict = districtSelect.value;

    areaSelect.innerHTML = '<option value="">-- থানা/এলাকা বেছে নিন --</option>';

    if(selectedDistrict && districtAreas[selectedDistrict]) {
        districtAreas[selectedDistrict].forEach(area => {
            const opt = document.createElement("option");
            opt.value = area;
            opt.innerText = area;
            areaSelect.appendChild(opt);
        });
    } else {
        areaSelect.innerHTML = '<option value="">-- প্রথমে জেলা বেছে নিন --</option>';
    }

    updateCheckoutTotal();
}

function updateCheckoutTotal(){
    let subtotal = 0;
    let hasRabbit = false;
    let hasHamster = false;
    let hasLivePet = false;

    if(typeof cart !== 'undefined' && cart.length > 0){
        cart.forEach(item => {
            const p = products.find(x => String(x.id) === String(item.id));
            if(p){
                const price = (p.discountPrice && p.discountPrice > 0 && p.discountPrice < p.price) ? p.discountPrice : p.price;
                subtotal += price * item.qty;
                
                const cat = (p.category || '').toLowerCase();
                const name = (p.name || '').toLowerCase();
                if(cat.includes('rabbit') || name.includes('rabbit') || name.includes('খরগোশ')){
                    hasRabbit = true;
                    hasLivePet = true;
                }
                if(cat.includes('hamster') || name.includes('hamster') || name.includes('হ্যামস্টার')){
                    hasHamster = true;
                    hasLivePet = true;
                }
            }
        });
    }
    
    const district = document.getElementById("deliveryDistrict").value;
    const isDhaka = (district === "Dhaka");

    // আপনার দেওয়া নির্দিষ্ট ডেলিভারি চার্জের নিয়ম
    let delivery = 80; // ডিফল্ট সাধারণ পণ্য

    if(hasRabbit){
        // খরগোশ: ঢাকার ভিতরে ৪০০, ঢাকার বাইরে ৫০০
        delivery = isDhaka ? 400 : 500;
    } else if(hasHamster){
        // হ্যামস্টার: ঢাকার ভিতরে ৩৫০, ঢাকার বাইরে ৪৫০
        delivery = isDhaka ? 350 : 450;
    } else {
        // সাধারণ এক্সেসরিজ বা খাবার
        if(district === "Gazipur" || district === "Narayanganj") {
            delivery = 120;
        } else if(district !== "Dhaka" && district !== "") {
            delivery = 150;
        }
    }
    
    const total = subtotal + delivery;

    document.getElementById("checkoutSubtotalText").innerText = subtotal;
    document.getElementById("checkoutDeliveryText").innerText = delivery;
    document.getElementById("checkoutTotalText").innerText = total;

    const advBox = document.getElementById("advancePaymentBox");
    if(hasLivePet){
        const adv = Math.round(total * 0.5);
        document.getElementById("advanceAmountText").innerText = adv;
        advBox.style.display = "block";
    } else {
        advBox.style.display = "none";
    }
}
</script>
